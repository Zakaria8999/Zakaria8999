<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>موقعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e4e4e0;
    --text: #000000;
    --muted: #444444;
    --accent: #2563eb;
    --danger: #dc2626;
    --radius: 10px;
  }

  body.dark {
    --bg: #111114;
    --surface: #1c1c20;
    --border: #2e2e34;
    --text: #ffffff;
    --muted: #aaaaaa;
    --accent: #60a5fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', Tahoma, Arial, sans-serif;
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(99,179,237,0.18) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.15) 0%, transparent 60%);
    background-attachment: fixed;
  }

  body.dark {
    background-image: radial-gradient(ellipse at 20% 20%, rgba(37,99,235,0.12) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.10) 0%, transparent 60%);
  }

  /* ===== HEADER ===== */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .site-title { font-size: 1.2rem; font-weight: 700; }

  .admin-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .admin-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== MAIN FEED ===== */
  .feed {
    max-width: 680px;
    margin: 32px auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .empty-feed {
    text-align: center;
    color: var(--muted);
    padding: 80px 20px;
    font-size: 0.95rem;
  }

  /* ===== POST CARD ===== */
  .post-card {
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.08),
      inset 0 1px 0 rgba(255,255,255,0.8),
      inset 0 -1px 0 rgba(255,255,255,0.2);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .post-card:hover {
    transform: translateY(-2px);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.12),
      inset 0 1px 0 rgba(255,255,255,0.9),
      inset 0 -1px 0 rgba(255,255,255,0.3);
  }

  body.dark .post-card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255,255,255,0.1),
      inset 0 -1px 0 rgba(255,255,255,0.04);
  }

  body.dark .post-card:hover {
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.15),
      inset 0 -1px 0 rgba(255,255,255,0.06);
  }

  .post-card.is-pinned {
    border-color: rgba(37, 99, 235, 0.5);
    border-width: 1.5px;
    box-shadow:
      0 4px 24px rgba(37, 99, 235, 0.15),
      inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .post-meta {
    padding: 14px 18px 0;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .post-type-badge {
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .badge-tip { background: #fdf4ff; color: #7c3aed; }

  .tip-card-img {
    width: 100%;
    display: block;
    max-height: 340px;
    object-fit: cover;
  }

  .tip-card-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 40px 16px 16px;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,0.15) 30%,
      rgba(0,0,0,0.65) 70%,
      rgba(0,0,0,0.85) 100%
    );
    backdrop-filter: blur(0px);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tip-card-footer .tip-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 3px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.25);
    color: #fff;
    align-self: flex-start;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.3);
  }

  .tip-card-footer .tip-text {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  .tip-card-footer .tip-sub {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.75);
    font-weight: 400;
  }

  .post-body { padding: 14px 18px 18px; }

  .post-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .post-content {
    font-size: 0.93rem;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-content.collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .read-more-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.85rem;
    margin-top: 6px;
    padding: 0;
  }

  .post-image {
    width: 100%;
    max-height: 480px;
    object-fit: cover;
    display: block;
    margin-top: 12px;
    border-radius: 6px;
  }

  .post-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 8px 16px;
    background: none;
    border: 1.5px solid;
    border-radius: 50px;
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 600;
    transition: all 0.2s;
    max-width: fit-content;
  }
  .post-link:hover { opacity: 0.75; }

  .post-footer {
    padding: 0 18px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .like-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 4px;
    color: var(--muted);
    font-size: 0.85rem;
    transition: color 0.2s;
  }

  .like-btn svg {
    transition: transform 0.15s, fill 0.2s, stroke 0.2s;
  }

  .like-btn:hover svg {
    transform: scale(1.15);
  }

  .like-btn.liked svg {
    fill: #ef4444;
    stroke: #ef4444;
  }

  .like-btn.liked { color: #ef4444; }

  @keyframes heartPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.4); }
    70%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  .like-btn.pop svg {
    animation: heartPop 0.35s ease forwards;
  }

  .delete-post-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 4px;
    display: none;
    transition: color 0.2s;
  }
  .delete-post-btn:hover { color: var(--danger); }
  body.admin-mode .delete-post-btn { display: inline-block; }

  .pin-post-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 4px;
    display: none;
    transition: color 0.2s;
  }
  .pin-post-btn:hover { color: var(--accent); }
  .pin-post-btn.pinned { color: var(--accent); font-weight: 700; }
  body.admin-mode .pin-post-btn { display: inline-block; }

  .pinned-badge {
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: #eff6ff;
    color: var(--accent);
    font-weight: 600;
    border: 1px solid var(--accent);
  }

  .post-card.is-pinned {
    border-color: var(--accent);
    border-width: 1.5px;
  }



  /* ===== LOGIN MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 360px;
    margin: 16px;
  }

  .modal h2 { font-size: 1.2rem; margin-bottom: 20px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: 'Cairo', inherit;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field textarea { min-height: 140px; resize: vertical; }

  .error-msg { color: var(--danger); font-size: 0.85rem; margin-bottom: 12px; display: none; }

  .btn-row { display: flex; gap: 10px; margin-top: 4px; }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: #1d4ed8; }

  .btn-secondary {
    flex: 1;
    background: none;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--text); color: var(--text); }

  /* ===== ADMIN BAR ===== */
  .admin-bar {
    display: none;
    background: #1e293b;
    color: #fff;
    padding: 12px 24px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  body.admin-mode .admin-bar { display: flex; }

  .admin-bar span { font-size: 0.85rem; color: #94a3b8; }

  .new-post-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.2s;
  }
  .new-post-btn:hover { background: #1d4ed8; }

  .logout-btn {
    background: none;
    border: 1px solid #475569;
    color: #94a3b8;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: #fff; color: #fff; }

  /* ===== NEW POST MODAL ===== */
  .type-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .type-tab {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    cursor: pointer;
    font-size: 0.85rem;
    text-align: center;
    transition: all 0.2s;
    color: var(--muted);
  }
  .type-tab.active {
    border-color: var(--accent);
    background: #eff6ff;
    color: var(--accent);
    font-weight: 600;
  }

  .type-fields { display: none; }
  .type-fields.active { display: block; }

  .image-upload-area {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .image-upload-area:hover { border-color: var(--accent); color: var(--accent); }

  #imagePreview {
    max-width: 100%;
    max-height: 200px;
    border-radius: 6px;
    margin-top: 10px;
    display: none;
  }

  /* Knight helmet color per mode */
  .knight-helmet path,
  .knight-helmet line {
    stroke: #000 !important;
    fill: none;
  }
  .knight-helmet path[fill="white"] {
    fill: rgba(0,0,0,0.08) !important;
  }
  body.dark .knight-helmet path,
  body.dark .knight-helmet line {
    stroke: #fff !important;
  }
  body.dark .knight-helmet path[fill="white"] {
    fill: rgba(255,255,255,0.15) !important;
  }
  .info-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #7c3aed;
    background: none;
    color: #7c3aed;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .info-btn:hover { background: #7c3aed; color: #fff; }

  .info-display {
    max-width: 680px;
    margin: 0 auto 0;
    padding: 0 16px;
    display: none;
  }
  .info-display.active { display: block; }

  .info-box {
    background: rgba(124,58,237,0.08);
    border: 1px solid rgba(124,58,237,0.25);
    border-radius: 14px;
    padding: 18px 20px;
    color: var(--text);
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-break: break-word;
    backdrop-filter: blur(10px);
    line-height: 1.8;
  }

  .info-edit-area {
    display: none;
  }
  body.admin-mode .info-edit-area { display: flex; }
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e293b;
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 0.9rem;
    transition: transform 0.3s;
    z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .hd-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 6px;
    pointer-events: none;
    user-select: none;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.2);
  }

  .platform-badge {
    position: absolute;
    top: 10px;
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 3px 9px;
    border-radius: 6px;
    pointer-events: none;
    user-select: none;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.2);
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }

  .platform-option {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 13px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 700;
    transition: all 0.18s;
    background: var(--bg);
    color: var(--muted);
    user-select: none;
    letter-spacing: 0.3px;
  }
  .platform-option:hover { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,0.06); }
  .platform-option.sel { color: var(--text); border-color: var(--text); background: transparent; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div style="display:flex;align-items:center;gap:10px;">
    <svg class="knight-helmet" width="28" height="28" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Knight helmet -->
      <path d="M20 10 C20 10 14 14 13 24 L13 38 C13 42 16 45 20 46 L20 50 L44 50 L44 46 C48 45 51 42 51 38 L51 28 L38 20 L32 10 Z" fill="white" opacity="0.15" stroke="white" stroke-width="1.5"/>
      <path d="M32 10 C32 10 26 12 22 18 C18 24 18 30 18 30 L46 30 L46 24 C46 24 42 14 32 10 Z" fill="white" opacity="0.25"/>
      <path d="M13 28 L13 38 C13 43 17 47 22 48 L22 52 L42 52 L42 48 C47 47 51 43 51 38 L51 28 Z" fill="white" opacity="0.1" stroke="white" stroke-width="1.5"/>
      <!-- Visor slits -->
      <line x1="18" y1="34" x2="30" y2="34" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="18" y1="39" x2="30" y2="39" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <line x1="18" y1="44" x2="28" y2="44" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <!-- Plume -->
      <path d="M32 10 C30 4 26 2 24 4 C22 6 24 10 28 12" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M32 10 C34 3 38 1 40 3 C42 5 39 9 35 11" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Outline -->
      <path d="M32 10 L38 20 L51 28 L51 38 C51 43 47 47 42 48 L42 52 L22 52 L22 48 C17 47 13 43 13 38 L13 24 C14 14 20 10 32 10 Z" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </svg>
    <div class="site-title" id="siteTitle">ZYNOK</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button class="admin-btn" id="darkToggle" onclick="toggleDark()" title="الوضع الداكن">
      <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <button class="admin-btn" onclick="showLogin()">الإدارة</button>
    <button class="info-btn" onclick="toggleInfo()" title="معلومات الموقع">i</button>
  </div>
</header>

<!-- INFO BOX -->
<div class="info-display" id="infoDisplay">
  <div style="margin-top:16px;">
    <div class="info-box" id="infoBox">لا توجد معلومات بعد.</div>
    <div class="info-edit-area" style="margin-top:10px;flex-direction:column;gap:8px;">
      <textarea id="infoTextarea" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:0.9rem;background:var(--bg);color:var(--text);min-height:100px;resize:vertical;" placeholder="اكتب معلومات الموقع هنا..."></textarea>
      <button onclick="saveInfo()" style="background:#7c3aed;color:#fff;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;font-size:0.9rem;font-weight:600;align-self:flex-start;">حفظ</button>
    </div>
  </div>
</div>

<!-- ADMIN BAR -->
<div class="admin-bar">
  <span>وضع الإدارة — يمكنك إضافة وحذف المنشورات</span>
  <div style="display:flex;gap:10px;">
    <button class="new-post-btn" onclick="showNewPost()">+ منشور جديد</button>
    <button class="logout-btn" onclick="logout()">خروج</button>
  </div>
</div>

<!-- FEED -->
<div class="feed" id="feed">
  <div class="empty-feed" id="emptyFeed">لا توجد منشورات بعد</div>
</div>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>دخول الإدارة</h2>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <div class="error-msg" id="loginError">كلمة المرور غير صحيحة</div>
    <div class="btn-row">
      <button class="btn-primary" onclick="doLogin()">دخول</button>
      <button class="btn-secondary" onclick="closeModal('loginModal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- NEW POST MODAL -->
<div class="modal-overlay" id="postModal">
  <div class="modal" style="max-width:520px;display:flex;flex-direction:column;max-height:85vh;">
    <h2>منشور جديد</h2>

    <div style="overflow-y:auto;flex:1;padding-bottom:4px;">
    <div class="type-tabs">
      <div class="type-tab active" onclick="switchType('image')">صورة</div>
      <div class="type-tab" onclick="switchType('link')">رابط</div>
      <div class="type-tab" onclick="switchType('text')">نص</div>
      <div class="type-tab" onclick="switchType('tip')">نصيحة</div>
    </div>

    <div class="field">
      <label>العنوان (اختياري)</label>
      <input type="text" id="postTitle" placeholder="عنوان المنشور..." />
    </div>

    <!-- IMAGE FIELDS -->
    <div class="type-fields active" id="fields-image">
      <div class="field">
        <div class="image-upload-area">
          <button type="button" onclick="triggerImagePick()" style="background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:0.95rem;">اختر صورة أو أكثر</button>
          <p style="margin-top:8px;font-size:0.82rem;color:var(--muted)" id="imgFileName">لم يتم اختيار صور</p>
          <div id="imagePreviews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
        </div>
        <input type="file" id="imgFile" accept="image/*" multiple style="position:absolute;left:-9999px;opacity:0;" onchange="previewImage(event)"/>
      </div>
      <div class="field">
        <label>وصف الصور (اختياري)</label>
        <textarea id="imageCaption" placeholder="اكتب وصفاً..."></textarea>
      </div>
      <div class="field">
        <label>المنصات (اختياري)</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;" id="platformSelector">
          <div class="platform-option" data-platform="PlayStation" data-key="ps" onclick="togglePlatform(this)">PlayStation</div>
          <div class="platform-option" data-platform="Xbox" data-key="xbox" onclick="togglePlatform(this)">Xbox</div>
          <div class="platform-option" data-platform="PC" data-key="pc" onclick="togglePlatform(this)">PC</div>
          <div class="platform-option" data-platform="Nintendo Switch" data-key="ns" onclick="togglePlatform(this)">Nintendo</div>
          <div class="platform-option" data-platform="Mobile" data-key="mob" onclick="togglePlatform(this)">Mobile</div>
          <div class="platform-option" data-platform="VR" data-key="vr" onclick="togglePlatform(this)">VR</div>
        </div>
      </div>
    </div>

    <!-- LINK FIELDS -->
    <div class="type-fields" id="fields-link">
      <div class="field">
        <label>الرابط</label>
        <input type="url" id="linkUrl" placeholder="https://..." />
      </div>
      <div class="field">
        <label>وصف الرابط (اختياري)</label>
        <textarea id="linkDesc" placeholder="اكتب وصفاً..."></textarea>
      </div>
    </div>

    <!-- TEXT FIELDS -->
    <div class="type-fields" id="fields-text">
      <div class="field">
        <label>النص</label>
        <textarea id="postText" style="min-height:200px" placeholder="اكتب نصك هنا..."></textarea>
      </div>
    </div>

    <!-- TIP FIELDS -->
    <div class="type-fields" id="fields-tip">
      <div class="field">
        <div class="image-upload-area">
          <button type="button" onclick="triggerTipImagePick()" style="background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:0.95rem;">اختر صورة للنصيحة</button>
          <p style="margin-top:8px;font-size:0.82rem;color:var(--muted)" id="tipImgFileName">لم يتم اختيار صورة</p>
          <img id="tipImagePreview" src="" alt="" style="max-width:100%;max-height:160px;border-radius:6px;margin-top:8px;display:none;"/>
        </div>
        <input type="file" id="tipImgFile" accept="image/*" style="position:absolute;left:-9999px;opacity:0;" onchange="previewTipImage(event)"/>
      </div>
      <div class="field">
        <label>نص النصيحة</label>
        <input type="text" id="tipText" placeholder="اكتب النصيحة هنا..." />
      </div>
      <div class="field">
        <label>لون خلفية النصيحة</label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;">
          <input type="color" id="tipColor" value="#1e293b" style="width:40px;height:36px;border:none;border-radius:6px;cursor:pointer;background:none;"/>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <div onclick="setTipColor('#1e293b')" style="width:28px;height:28px;border-radius:6px;background:#1e293b;cursor:pointer;border:2px solid transparent;"></div>
            <div onclick="setTipColor('#7c3aed')" style="width:28px;height:28px;border-radius:6px;background:#7c3aed;cursor:pointer;"></div>
            <div onclick="setTipColor('#dc2626')" style="width:28px;height:28px;border-radius:6px;background:#dc2626;cursor:pointer;"></div>
            <div onclick="setTipColor('#059669')" style="width:28px;height:28px;border-radius:6px;background:#059669;cursor:pointer;"></div>
            <div onclick="setTipColor('#d97706')" style="width:28px;height:28px;border-radius:6px;background:#d97706;cursor:pointer;"></div>
            <div onclick="setTipColor('#0369a1')" style="width:28px;height:28px;border-radius:6px;background:#0369a1;cursor:pointer;"></div>
          </div>
        </div>
      </div>
    </div>

    </div>
    <div class="btn-row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);flex-shrink:0;">
      <button class="btn-primary" onclick="publishPost()">نشر</button>
      <button class="btn-secondary" onclick="closeModal('postModal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ===== CONFIG =====
  const ADMIN_PASSWORD = "ANIME TTT"; // ← غيّر كلمة المرور هنا
  const SITE_TITLE = "ZYNOK";        // ← غيّر اسم موقعك هنا

  // ===== STATE =====
  let isAdmin = false;
  let posts = JSON.parse(localStorage.getItem('posts') || '[]');
  let currentType = 'image';
  let selectedImageData = null;
  let selectedPlatforms = [];

  const PLATFORM_KEYS = {PlayStation:'ps',Xbox:'xbox',PC:'pc','Nintendo Switch':'ns',Mobile:'mob',VR:'vr'};

  function togglePlatform(el) {
    const p = el.dataset.platform;
    const k = el.dataset.key;
    if (selectedPlatforms.includes(p)) {
      selectedPlatforms = selectedPlatforms.filter(x => x !== p);
      el.classList.remove('sel', 'sel-' + k);
    } else {
      if (selectedPlatforms.length >= 2) { showToast('يمكنك اختيار منصتين فقط'); return; }
      selectedPlatforms.push(p);
      el.classList.add('sel', 'sel-' + k);
    }
  }

  document.getElementById('siteTitle').textContent = SITE_TITLE;
  document.title = SITE_TITLE;

  // ===== RENDER =====
  function render() {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    if (posts.length === 0) {
      feed.innerHTML = '<div class="empty-feed">لا توجد منشورات بعد</div>';
      return;
    }

    // المثبّتات أولاً ثم الباقي
    const sorted = [...posts].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

    sorted.forEach((post) => {
      const i = posts.indexOf(post);
      const card = document.createElement('div');
      card.className = 'post-card' + (post.pinned ? ' is-pinned' : '');

      const date = new Date(post.date).toLocaleDateString('ar-SA', {
        year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'
      });

      const typeLabel = {image:'صورة', link:'رابط', text:'نص', tip:'نصيحة'}[post.type] || 'منشور';
      const badgeClass = {image:'badge-image', link:'badge-link', text:'badge-text', tip:'badge-tip'}[post.type] || 'badge-text';
      const pinnedBadge = post.pinned ? `<span class="pinned-badge">مثبّت</span>` : '';

      let bodyHTML = '';

      if (post.type === 'tip') {
        bodyHTML = `
          ${post.title ? `<div class="post-title">${esc(post.title)}</div>` : ''}
          <div style="position:relative;border-radius:10px;overflow:hidden;min-height:160px;">
            ${post.tipImage
              ? `<img src="${post.tipImage}" style="width:100%;max-height:320px;min-height:160px;object-fit:cover;display:block;"/>`
              : `<div style="height:160px;background:${esc(post.tipColor)};"></div>`}
            <div class="tip-card-footer">
              <span class="tip-label">نصيحة</span>
              <span class="tip-text">${esc(post.tipText)}</span>
            </div>
          </div>
        `;

      } else if (post.type === 'image') {
        const imgs = post.images || (post.imageData ? [post.imageData] : []);
        const gridStyle = imgs.length > 1
          ? 'display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:12px;'
          : 'margin-top:12px;';
        const platformBadges = (post.platforms && post.platforms.length)
          ? post.platforms.map((p,pi) => {
              const rightOffset = 10 + pi * 75;
              return `<span class="platform-badge" style="right:${rightOffset}px;top:10px;">${p}</span>`;
            }).join('')
          : '';
        const imgTags = imgs.map(src =>
          `<div style="position:relative;display:inline-block;width:100%;">
            <img src="${src}" alt="" style="width:100%;${imgs.length>1?'height:140px;object-fit:cover;':'max-height:480px;object-fit:cover;'}border-radius:6px;display:block;"/>
            <span class="hd-badge">HD</span>
            ${platformBadges}
          </div>`
        ).join('');
        bodyHTML = `
          ${post.title ? `<div class="post-title">${esc(post.title)}</div>` : ''}
          <div style="${gridStyle}">${imgTags}</div>
          ${post.caption ? `<div class="post-content" style="margin-top:10px">${esc(post.caption)}</div>` : ''}
        `;
      } else if (post.type === 'link') {
        let domainName = post.url;
        let siteName = post.url;
        let linkColor = '#2563eb';
        try {
          const u = new URL(post.url);
          domainName = u.hostname.replace('www.', '');
          siteName = domainName.split('.')[0];
          siteName = siteName.charAt(0).toUpperCase() + siteName.slice(1);
        } catch(e) {}

        // لون مخصص لكل موقع مشهور
        const colors = {
          'youtube': '#ff0000',
          'twitter': '#1d9bf0',
          'x': '#000000',
          'instagram': '#e1306c',
          'facebook': '#1877f2',
          'tiktok': '#010101',
          'discord': '#5865f2',
          'reddit': '#ff4500',
          'twitch': '#9146ff',
          'github': '#333',
          'spotify': '#1db954',
          'steam': '#1b2838',
          'google': '#4285f4',
          'wikipedia': '#000',
        };
        const key = siteName.toLowerCase();
        if (colors[key]) linkColor = colors[key];

        bodyHTML = `
          ${post.title ? `<div class="post-title">${esc(post.title)}</div>` : ''}
          <a class="post-link" href="${esc(post.url)}" target="_blank" rel="noopener" style="border-color:${linkColor};color:${linkColor};">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            ${esc(siteName)}
          </a>
          ${post.desc ? `<div class="post-content" style="margin-top:10px">${esc(post.desc)}</div>` : ''}
        `;
      } else {
        const isLong = post.text && post.text.length > 400;
        const postId = 'post-' + i;
        bodyHTML = `
          ${post.title ? `<div class="post-title">${esc(post.title)}</div>` : ''}
          <div class="post-content ${isLong ? 'collapsed' : ''}" id="${postId}">${esc(post.text)}</div>
          ${isLong ? `<button class="read-more-btn" onclick="toggleReadMore('${postId}', this)">اقرأ المزيد ▼</button>` : ''}
        `;
      }

        const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '{}');
        const myLike = !!likedPosts[i];
        const likesCount = posts[i].likes || 0;

        card.innerHTML = `
        <div class="post-meta">
          <span style="display:flex;align-items:center;gap:6px;">${date} ${pinnedBadge}</span>
          <span class="post-type-badge ${badgeClass}">${typeLabel}</span>
        </div>
        <div class="post-body">${bodyHTML}</div>
        <div class="post-footer">
          <button class="like-btn ${myLike ? 'liked' : ''}" onclick="toggleLike(${i}, this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="${myLike ? '#ef4444' : 'none'}" stroke="${myLike ? '#ef4444' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span>${isAdmin ? likesCount : ''}</span>
          </button>
          <div style="display:flex;gap:4px;">
            <button class="pin-post-btn ${post.pinned ? 'pinned' : ''}" onclick="togglePin(${i})">${post.pinned ? 'إلغاء التثبيت' : 'تثبيت'}</button>
            <button class="delete-post-btn" onclick="deletePost(${i})">حذف</button>
          </div>
        </div>
      `;

      feed.appendChild(card);
    });
  }

  function toggleReadMore(id, btn) {
    const el = document.getElementById(id);
    if (el.classList.contains('collapsed')) {
      el.classList.remove('collapsed');
      btn.textContent = 'اقرأ أقل ▲';
    } else {
      el.classList.add('collapsed');
      btn.textContent = 'اقرأ المزيد ▼';
    }
  }

  function esc(str) {
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // ===== LOGIN =====
  function showLogin() {
    if (isAdmin) { logout(); return; }
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginModal').classList.add('active');
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
  }

  function doLogin() {
    const pw = document.getElementById('passwordInput').value;
    if (pw === ADMIN_PASSWORD) {
      isAdmin = true;
      document.body.classList.add('admin-mode');
      document.querySelector('.admin-btn').textContent = '✓ إدارة';
      closeModal('loginModal');
      showToast('مرحباً! أنت الآن في وضع الإدارة');
      render();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    isAdmin = false;
    document.body.classList.remove('admin-mode');
    document.querySelector('.admin-btn').textContent = '⚙ الإدارة';
    render();
    showToast('تم الخروج من وضع الإدارة');
  }

  // ===== NEW POST =====
  function showNewPost() {
    document.getElementById('postTitle').value = '';
    document.getElementById('imageCaption').value = '';
    document.getElementById('linkUrl').value = '';
    document.getElementById('linkDesc').value = '';
    document.getElementById('postText').value = '';
    document.getElementById('tipText').value = '';
    document.getElementById('tipImgFileName').textContent = 'لم يتم اختيار صورة';
    document.getElementById('tipImagePreview').style.display = 'none';
    selectedTipImageData = null;
    document.getElementById('imagePreviews').innerHTML = '';
    const fn = document.getElementById('imgFileName');
    if (fn) fn.textContent = 'لم يتم اختيار صور';
    selectedImageData = null;
    selectedPlatforms = [];
    document.querySelectorAll('.platform-option').forEach(el => {
      el.classList.remove('sel','sel-ps','sel-xbox','sel-pc','sel-ns','sel-mob','sel-vr');
    });
    switchType('image');
    document.getElementById('postModal').classList.add('active');
  }

  function switchType(type) {
    currentType = type;
    document.querySelectorAll('.type-tab').forEach((t,i) => {
      t.classList.toggle('active', ['image','link','text','tip'][i] === type);
    });
    document.querySelectorAll('.type-fields').forEach(f => f.classList.remove('active'));
    document.getElementById('fields-' + type).classList.add('active');
  }

  let selectedTipImageData = null;

  function setTipColor(color) {
    document.getElementById('tipColor').value = color;
  }

  function triggerTipImagePick() {
    const inp = document.getElementById('tipImgFile');
    inp.value = '';
    inp.click();
  }

  function previewTipImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('tipImgFileName').textContent = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => {
      selectedTipImageData = ev.target.result;
      const preview = document.getElementById('tipImagePreview');
      preview.src = selectedTipImageData;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  function triggerImagePick() {
    const inp = document.getElementById('imgFile');
    inp.value = '';
    inp.click();
  }

  function previewImage(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    selectedImageData = [];
    document.getElementById('imgFileName').textContent = `تم اختيار ${files.length} صورة`;
    const container = document.getElementById('imagePreviews');
    container.innerHTML = '';
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        selectedImageData.push(ev.target.result);
        const img = document.createElement('img');
        img.src = ev.target.result;
        img.style.cssText = 'width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border);';
        container.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }

  function publishPost() {
    const title = document.getElementById('postTitle').value.trim();
    let post = { type: currentType, title, date: new Date().toISOString() };

    if (currentType === 'image') {
      if (!selectedImageData || !selectedImageData.length) { showToast('اختر صورة أولاً'); return; }
      post.images = selectedImageData;
      post.caption = document.getElementById('imageCaption').value.trim();
      post.platforms = selectedPlatforms.slice();
    } else if (currentType === 'link') {
      const url = document.getElementById('linkUrl').value.trim();
      if (!url) { showToast('أدخل رابطاً'); return; }
      post.url = url;
      post.desc = document.getElementById('linkDesc').value.trim();
    } else if (currentType === 'tip') {
      const tipText = document.getElementById('tipText').value.trim();
      if (!tipText) { showToast('اكتب النصيحة أولاً'); return; }
      post.tipText = tipText;
      post.tipColor = document.getElementById('tipColor').value || '#1e293b';
      post.tipImage = selectedTipImageData || null;
    } else {
      const text = document.getElementById('postText').value.trim();
      if (!text) { showToast('أدخل نصاً'); return; }
      post.text = text;
    }

    posts.unshift(post);
    save();
    render();
    closeModal('postModal');
    showToast('تم النشر بنجاح');
  }

  function toggleLike(i, btn) {
    if (isAdmin) return;

    // إعجابات شخصية مخزنة في المتصفح
    const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '{}');
    const liked = likedPosts[i];

    if (liked) {
      delete likedPosts[i];
      posts[i].likes = Math.max((posts[i].likes || 1) - 1, 0);
    } else {
      likedPosts[i] = true;
      posts[i].likes = (posts[i].likes || 0) + 1;
    }

    localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
    save();

    // انميشن
    btn.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('pop');
    btn.classList.toggle('liked', !liked);

    const svg = btn.querySelector('svg');
    svg.setAttribute('fill', !liked ? '#ef4444' : 'none');
    svg.setAttribute('stroke', !liked ? '#ef4444' : 'currentColor');

    // عدد الإعجابات للأدمن فقط
    const countEl = btn.querySelector('span');
    if (countEl) countEl.textContent = isAdmin ? (posts[i].likes || 0) : '';
  }

  function togglePin(i) {
    posts[i].pinned = !posts[i].pinned;
    save();
    render();
    showToast(posts[i].pinned ? 'تم تثبيت المنشور' : 'تم إلغاء التثبيت');
  }

  function deletePost(i) {
    if (!confirm('هل تريد حذف هذا المنشور؟')) return;
    posts.splice(i, 1);
    save();
    render();
    showToast('تم الحذف');
  }

  // ===== UTILS =====
  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
  });

  function save() {
    try { localStorage.setItem('posts', JSON.stringify(posts)); } catch(e) {}
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ===== INFO =====
  let infoText = localStorage.getItem('siteInfo') || '';

  function renderInfo() {
    const box = document.getElementById('infoBox');
    const textarea = document.getElementById('infoTextarea');
    box.textContent = infoText || 'لا توجد معلومات بعد.';
    textarea.value = infoText;
  }

  function toggleInfo() {
    const el = document.getElementById('infoDisplay');
    el.classList.toggle('active');
    if (el.classList.contains('active')) renderInfo();
  }

  function saveInfo() {
    infoText = document.getElementById('infoTextarea').value.trim();
    localStorage.setItem('siteInfo', infoText);
    renderInfo();
    showToast('تم حفظ المعلومات');
  }

  // INIT
  render();

  // ===== DARK MODE =====
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark');
    document.getElementById('iconMoon').style.display = isDark ? 'none' : 'inline';
    document.getElementById('iconSun').style.display = isDark ? 'inline' : 'none';
    localStorage.setItem('darkMode', isDark ? '1' : '0');
  }

  if (localStorage.getItem('darkMode') === '1') {
    document.body.classList.add('dark');
    document.getElementById('iconMoon').style.display = 'none';
    document.getElementById('iconSun').style.display = 'inline';
  }
</script>
</body>
</html>
